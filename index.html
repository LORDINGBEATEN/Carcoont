<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compteur Manille</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
  :root { --bg: #0f5132; --panel: #fffdf6; --ink: #1c1c1c; --accent: #f2b705; --muted: #8a8a7a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif;
    min-height: 100vh; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); user-select: none; }
  main { max-width: 640px; margin: 0 auto; }
  .score { background: rgba(0,0,0,.25); border-radius: 16px; padding: 14px 18px; display: flex;
    align-items: center; justify-content: space-between; }
  .score .big { font-size: 56px; font-weight: 800; line-height: 1; }
  .score .big small { font-size: 20px; font-weight: 500; opacity: .7; }
  .score .side { text-align: right; font-size: 14px; opacity: .9; line-height: 1.5; }
  .score .side b { font-size: 18px; }
  .cam { position: relative; margin: 12px 0; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    font-size: 15px; opacity: .85; }
  .cam .badge { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); border-radius: 10px;
    padding: 6px 12px; font-size: 14px; }
  .cam .flash { position: absolute; right: 10px; top: 10px; background: var(--accent); color: #222; font-weight: 800;
    font-size: 40px; width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center;
    opacity: 0; transition: opacity .4s; }
  .cam .flash.on { opacity: 1; transition: none; }
  .actions { display: flex; gap: 8px; margin: 12px 0; }
  button.act { flex: 1; padding: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #222; }
  button.act.alt { background: rgba(255,255,255,.18); color: #fff; }
  button.act:disabled { opacity: .4; }
  .rank { display: flex; align-items: center; gap: 12px; background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; }
  .rank .l { font-size: 28px; font-weight: 800; width: 44px; }
  .rank .n { flex: 1; font-size: 13px; color: var(--muted); }
  .rank .n b { color: var(--ink); font-size: 16px; }
  .rank button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: #e9e6d8; font-size: 22px; font-weight: 700; }
  .rank .c { width: 28px; text-align: center; font-size: 22px; font-weight: 800; }
  .rank.hit { outline: 3px solid var(--accent); }
  .hint { font-size: 13px; opacity: .75; margin: 6px 2px 10px; }
</style>
</head>
<body>
<main>
  <div class="score">
    <div class="big"><span id="total">0</span><small> / 60</small></div>
    <div class="side">
      <div><b id="count">0</b> cartes</div>
      <div>Adversaires : <b id="opp">60</b></div>
    </div>
  </div>

  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="off" id="off">Touchez « Démarrer la caméra » puis faites défiler vos cartes,<br>coin chiffré bien visible, l'une après l'autre.</div>
    <div class="badge" id="badge" hidden></div>
    <div class="flash" id="flash"></div>
  </div>

  <p class="hint" id="debug" style="font-family:monospace;min-height:1.4em"></p>
  <div class="actions">
    <button class="act" id="start">Démarrer la caméra</button>
    <button class="act alt" id="undo">↩︎ Annuler</button>
    <button class="act alt" id="reset">Raz</button>
  </div>
  <p class="hint">Chaque carte est comptée quand son chiffre est lu 3 fois de suite. Retirez-la de l'image avant de montrer la suivante. Corrigez avec + / − si besoin.</p>

  <div id="ranks"></div>
</main>

<script>
  // Manille : 10 = 5, As = 4, Roi = 3, Dame = 2, Valet = 1, le reste 0 (total 60). 4 cartes par rang.
  const RANKS = [
    { k: '10', name: '10 (manille)', p: 5 }, { k: 'A', name: 'As (manillon)', p: 4 },
    { k: 'R', name: 'Roi', p: 3 }, { k: 'D', name: 'Dame', p: 2 }, { k: 'V', name: 'Valet', p: 1 },
    { k: '9', name: '9', p: 0 }, { k: '8', name: '8', p: 0 }, { k: '7', name: '7', p: 0 },
  ];
  // lettres lues -> rang (jeux français R/D/V et internationaux K/Q/J)
  const ALIAS = { '10': '10', '1O': '10', 'IO': '10', 'I0': '10', '1D': '10', A: 'A', R: 'R', K: 'R',
                  D: 'D', Q: 'D', V: 'V', J: 'V', '9': '9', '8': '8', '7': '7' };
  const KEY = 'manille-v2';
  let log = [];                       // historique des rangs comptés (pour Annuler)
  try { log = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const nOf = k => log.filter(x => x === k).length;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(log)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const box = $('ranks');
  RANKS.forEach(r => {
    const d = document.createElement('div');
    d.className = 'rank'; d.id = 'r-' + r.k;
    d.innerHTML = `<div class="l">${r.k}</div><div class="n">${r.name}<br><b>${r.p} pt${r.p > 1 ? 's' : ''}</b></div>
      <button data-k="${r.k}" data-d="-1">−</button><div class="c" id="c-${r.k}"></div><button data-k="${r.k}" data-d="1">+</button>`;
    box.appendChild(d);
  });
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (b.dataset.d === '1') { if (nOf(k) < 4) log.push(k); }
    else { const i = log.lastIndexOf(k); if (i >= 0) log.splice(i, 1); }
    render();
  };

  function render() {
    let total = 0;
    RANKS.forEach(r => { const n = nOf(r.k); total += n * r.p; $('c-' + r.k).textContent = n; });
    $('total').textContent = total;
    $('count').textContent = log.length;
    $('opp').textContent = 60 - total;
    $('undo').disabled = !log.length;
    save();
  }
  $('undo').onclick = () => { log.pop(); render(); };
  $('reset').onclick = () => { if (!log.length || confirm('Effacer la donne en cours ?')) { log = []; render(); } };

  // ---------- Caméra + lecture du coin des cartes ----------
  const STABLE = 3;       // lectures identiques consécutives pour valider une carte
  const GAP = 2;          // lectures « vides » nécessaires avant de pouvoir compter la carte suivante
  let worker, stream, running = false;
  let cand = null, candN = 0, empty = GAP, armed = true;
  const work = document.createElement('canvas');

  function readRank(words) {
    // garde les mots courts reconnus comme rang, assez hauts et assez sûrs ; prend le plus gros
    let best = null;
    $('debug').textContent = words.length
      ? words.map(w => `"${w.text}" ${Math.round(w.confidence)}% h${w.bbox.y1 - w.bbox.y0}`).slice(0, 8).join('  ')
      : 'rien lu';
    for (const w of words) {
      const t = (w.text || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase();
      const k = ALIAS[t];
      if (!k || w.confidence < 35) continue;
      const h = w.bbox.y1 - w.bbox.y0;
      if (h < 18) continue;                    // trop petit : probablement du bruit
      if (!best || h > best.h) best = { k, h };
    }
    return best && best.k;
  }

  async function loop() {
    while (running) {
      const v = $('video');
      if (v.readyState >= 2) {
        const W = 1000, H = Math.round(W * v.videoHeight / v.videoWidth);
        work.width = W; work.height = H;
        const ctx = work.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(v, 0, 0, W, H);
        // noir et blanc : seuil moyen de l'image, pour isoler l'encre du carton
        const img = ctx.getImageData(0, 0, W, H), px = img.data;
        let sum = 0;
        for (let i = 0; i < px.length; i += 4) sum += (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11);
        const thr = sum / (px.length / 4) * 0.8;
        for (let i = 0; i < px.length; i += 4) {
          const g = px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11;
          px[i] = px[i + 1] = px[i + 2] = g > thr ? 255 : 0;
        }
        ctx.putImageData(img, 0, 0);
        let words = [];
        try {
          const { data } = await worker.recognize(work, {}, { blocks: true });
          words = data.words || (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines.flatMap(l => l.words)));
        } catch (e) {}
        step(readRank(words));
      }
      await new Promise(r => setTimeout(r, 30));
    }
  }

  function step(k) {
    $('badge').textContent = k ? 'Lu : ' + k : 'Aucune carte';
    if (!k) { cand = null; candN = 0; if (++empty >= GAP) armed = true; return; }
    empty = 0;
    if (k === cand) candN++; else { cand = k; candN = 1; armed = true; }   // un autre rang réarme
    if (candN >= STABLE && armed) {
      armed = false;                          // il faut retirer la carte (ou la changer) avant la suivante
      if (nOf(k) < 4) { log.push(k); render(); flash(k); }
    }
  }

  function flash(k) {
    const f = $('flash'); f.textContent = k; f.classList.add('on');
    const row = $('r-' + k); row.classList.add('hit');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(() => { f.classList.remove('on'); row.classList.remove('hit'); }, 500);
  }

  async function start() {
    $('start').disabled = true; $('start').textContent = 'Chargement…';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
      $('video').srcObject = stream; await $('video').play();
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_char_whitelist: '10IOAKQJRDV987', tessedit_pageseg_mode: '6' });
      $('off').hidden = true; $('badge').hidden = false;
      running = true; $('start').disabled = false; $('start').textContent = 'Arrêter'; loop();
    } catch (e) {
      $('off').hidden = false;
      $('off').textContent = 'Caméra indisponible : ' + (e.message || e) + '. Utilisez + / − en attendant.';
      $('start').disabled = false; $('start').textContent = 'Démarrer la caméra';
    }
  }
  function stop() {
    running = false; if (stream) stream.getTracks().forEach(t => t.stop());
    if (worker) worker.terminate(); worker = null;
    $('badge').hidden = true; $('off').hidden = false; $('off').textContent = 'Caméra arrêtée.';
    $('start').textContent = 'Démarrer la caméra';
  }
  $('start').onclick = () => (running ? stop() : start());
  render();
</script>
</body>
</html>
