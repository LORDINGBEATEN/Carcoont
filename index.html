<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compteur Manille</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
<style>
  :root { --bg: #0f5132; --panel: #fffdf6; --ink: #1c1c1c; --red: #c62828; --accent: #f2b705; --muted: #8a8a7a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif;
    min-height: 100vh; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); user-select: none; }
  main { max-width: 640px; margin: 0 auto; }
  .score { background: rgba(0,0,0,.25); border-radius: 16px; padding: 14px 18px; display: flex;
    align-items: center; justify-content: space-between; }
  .score .big { font-size: 56px; font-weight: 800; line-height: 1; }
  .score .big small { font-size: 20px; font-weight: 500; opacity: .7; }
  .score .side { text-align: right; font-size: 14px; opacity: .9; line-height: 1.5; }
  .score .side b { font-size: 18px; }
  .cam { position: relative; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4/3; width: 100%; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cam video { object-fit: fill; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    font-size: 15px; opacity: .9; background: rgba(0,0,0,.5); }
  .cam .flash { position: absolute; right: 10px; top: 10px; background: var(--accent); color: #222; font-weight: 800;
    font-size: 30px; padding: 8px 14px; border-radius: 14px; opacity: 0; transition: opacity .4s; }
  .cam .flash.on { opacity: 1; transition: none; }
  .actions { display: flex; gap: 8px; margin: 12px 0; }
  button.act { flex: 1; padding: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #222; }
  button.act.alt { background: rgba(255,255,255,.18); color: #fff; }
  button.act:disabled { opacity: .4; }
  .hint { font-size: 13px; opacity: .8; margin: 6px 2px 10px; line-height: 1.4; }
  .dbg { font-family: monospace; font-size: 12px; opacity: .85; margin: 4px 2px 6px; min-height: 2.6em; white-space: pre-line; }
  .thr { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .9; margin: 4px 2px 10px; }
  .thr input { flex: 1; }
  .suit { margin-top: 14px; }
  .suit h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { background: var(--panel); color: var(--ink); border-radius: 10px; border: 0; padding: 10px 0 6px;
    font-size: 24px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .card.red { color: var(--red); }
  .card .pts { font-size: 11px; font-weight: 600; color: var(--muted); }
  .card.taken { background: var(--accent); }
  .card.taken .pts { color: #4a3a00; }
  .card.hit { outline: 3px solid #fff; }
</style>
</head>
<body>
<main>
  <div class="score">
    <div class="big"><span id="total">0</span><small> / 60</small></div>
    <div class="side">
      <div><b id="count">0</b> cartes</div>
      <div>Adversaires : <b id="opp">60</b></div>
    </div>
  </div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <canvas id="over"></canvas>
    <div class="off" id="off">Touchez « Démarrer la caméra ».<br>Présentez les cartes une à une, bien visibles.</div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="dbg" id="debug">—</div>
  <label class="thr">Seuil de confiance <input type="range" id="thr" min="25" max="90" value="50"><b id="thrv">50 %</b></label>

  <div class="actions">
    <button class="act" id="start">Démarrer la caméra</button>
  </div>
  <div class="actions">
    <button class="act alt" id="undo">↩︎ Annuler</button>
    <button class="act alt" id="reset">Nouvelle donne</button>
  </div>
  <p class="hint">Chaque carte est comptée une seule fois par donne, dès qu'elle est lue de façon stable. Touchez une carte ci-dessous pour corriger à la main.</p>

  <div id="deck"></div>
  <p class="hint" style="text-align:center;margin-top:20px">Compteur Manille · <b id="version"></b> · <span id="engine">modèle non chargé</span></p>
</main>

<script>
  const SUITS = [
    { id: 'coeur', name: 'Cœurs', sym: '♥', red: true }, { id: 'carreau', name: 'Carreaux', sym: '♦', red: true },
    { id: 'pique', name: 'Piques', sym: '♠', red: false }, { id: 'trefle', name: 'Trèfles', sym: '♣', red: false },
  ];
  // Manille : 10 = 5, As = 4, Roi = 3, Dame = 2, Valet = 1, le reste 0 (total 60)
  const VALUES = [{ l: '10', p: 5 }, { l: 'A', p: 4 }, { l: 'R', p: 3 }, { l: 'D', p: 2 }, { l: 'V', p: 1 }, { l: '9', p: 0 }, { l: '8', p: 0 }, { l: '7', p: 0 }];
  const $ = id => document.getElementById(id);
  const ptsOf = id => VALUES.find(v => v.l === id.split('-')[1]).p;
  const suitOf = id => SUITS.find(s => s.id === id.split('-')[0]);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let taken = load('manille-v3', []);   // cartes comptées, dans l'ordre
  let seen = {};                         // nombre d'images consécutives où chaque carte est vue

  // ---------- Affichage des 32 cartes ----------
  SUITS.forEach(s => {
    const sec = document.createElement('section'); sec.className = 'suit';
    sec.innerHTML = `<h2><span>${s.sym} ${s.name}</span><span id="sub-${s.id}"></span></h2><div class="row"></div>`;
    VALUES.forEach(v => {
      const id = `${s.id}-${v.l}`, b = document.createElement('button');
      b.className = 'card' + (s.red ? ' red' : ''); b.dataset.id = id;
      b.innerHTML = `${v.l}<span>${s.sym}</span><span class="pts">${v.p} pt${v.p > 1 ? 's' : ''}</span>`;
      b.onclick = () => { const i = taken.indexOf(id); i >= 0 ? taken.splice(i, 1) : taken.push(id); render(); };
      sec.querySelector('.row').appendChild(b);
    });
    $('deck').appendChild(sec);
  });
  function render() {
    let total = 0;
    document.querySelectorAll('.card').forEach(el => {
      const on = taken.includes(el.dataset.id); el.classList.toggle('taken', on);
      if (on) total += ptsOf(el.dataset.id);
    });
    SUITS.forEach(s => {
      const sub = taken.filter(id => id.startsWith(s.id + '-')).reduce((a, id) => a + ptsOf(id), 0);
      $('sub-' + s.id).textContent = sub ? sub + ' pts' : '';
    });
    $('total').textContent = total; $('count').textContent = taken.length; $('opp').textContent = 60 - total;
    $('undo').disabled = !taken.length; store('manille-v3', taken);
  }
  $('undo').onclick = () => { taken.pop(); render(); };
  $('reset').onclick = () => { if (!taken.length || confirm('Effacer la donne en cours ?')) { taken = []; seen = {}; render(); } };

  // ---------- Modèle de détection (baloot-fan-v2, YOLO11n, licence MIT) ----------
  // Classes 0-31 : couleurs dans l'ordre cœur, carreau, trèfle, pique ; rangs A K Q J 10 9 8 7. Classe 32 = « autre » (2 à 6).
  const M_SUITS = ['coeur', 'carreau', 'trefle', 'pique'], M_RANKS = ['A', 'R', 'D', 'V', '10', '9', '8', '7'];   // K→R, Q→D, J→V
  const cardOfClass = c => `${M_SUITS[c >> 3]}-${M_RANKS[c & 7]}`;
  const SIZE = 704;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  let session = null;
  const inCv = document.createElement('canvas'); inCv.width = inCv.height = SIZE;
  const inCtx = inCv.getContext('2d', { willReadFrequently: true });
  const inData = new Float32Array(3 * SIZE * SIZE);

  function toTensor(src) {
    inCtx.drawImage(src, 0, 0, SIZE, SIZE);                       // étirement sans conserver les proportions, comme à l'entraînement
    const px = inCtx.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE;
    for (let i = 0; i < n; i++) { inData[i] = px[i * 4] / 255; inData[n + i] = px[i * 4 + 1] / 255; inData[2 * n + i] = px[i * 4 + 2] / 255; }
    return new ort.Tensor('float32', inData, [1, 3, SIZE, SIZE]);
  }
  async function loadModel() {
    if (session) return;
    $('engine').textContent = 'chargement du modèle…';
    const attempts = [];
    if (navigator.gpu) attempts.push(['model/baloot-fan-v2.fp16.onnx', ['webgpu'], 'WebGPU']);
    attempts.push(['model/baloot-fan-v2.int8.onnx', ['wasm'], 'processeur']);
    for (const [url, eps, name] of attempts) {
      try {
        const s = await ort.InferenceSession.create(url, { executionProviders: eps });
        const out = await s.run({ images: new ort.Tensor('float32', new Float32Array(3 * SIZE * SIZE), [1, 3, SIZE, SIZE]) });   // essai à blanc
        if (out.output0.type !== 'float32') throw new Error('sortie non float32');
        session = s; $('engine').textContent = 'moteur : ' + name; return;
      } catch (e) { console.warn('modèle', name, e); }
    }
    throw new Error('Impossible de charger le modèle de détection.');
  }

  function iou(a, b) {
    const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    if (w <= 0 || h <= 0) return 0;
    const i = w * h; return i / ((a.x1 - a.x0) * (a.y1 - a.y0) + (b.x1 - b.x0) * (b.y1 - b.y0) - i);
  }
  function decode(out, thr) {   // sortie [1, 4+33, 10164] : cx, cy, w, h puis 33 scores de classe
    const d = out.data, N = out.dims[2], C = out.dims[1] - 4, dets = [];
    for (let i = 0; i < N; i++) {
      let best = -1, bs = 0;
      for (let c = 0; c < C; c++) { const v = d[(4 + c) * N + i]; if (v > bs) { bs = v; best = c; } }
      if (bs < thr || best >= 32) continue;
      const cx = d[i], cy = d[N + i], w = d[2 * N + i], h = d[3 * N + i];
      dets.push({ id: cardOfClass(best), s: bs, x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 });
    }
    dets.sort((a, b) => b.s - a.s);
    const keep = [];
    for (const x of dets) if (keep.every(k => iou(k, x) < .5)) keep.push(x);
    return keep;
  }

  // ---------- Caméra et boucle de détection ----------
  let stream, running = false;
  const STABLE = 2;   // images consécutives avant de compter une carte

  function layout() {
    const v = $('video'), vw = v.videoWidth, vh = v.videoHeight;
    $('cam').style.width = `min(100%, ${55 * vw / vh}vh)`; $('cam').style.aspectRatio = vw + '/' + vh;
    const o = $('over'); o.width = SIZE; o.height = Math.round(SIZE * vh / vw);
  }
  function drawBoxes(dets) {
    const o = $('over'), x = o.getContext('2d'), sx = o.width / SIZE, sy = o.height / SIZE;
    x.clearRect(0, 0, o.width, o.height); x.lineWidth = 3; x.font = 'bold 22px sans-serif';
    for (const d of dets) {
      const have = taken.includes(d.id), s = suitOf(d.id);
      x.strokeStyle = have ? '#2e9e5b' : '#f2b705'; x.fillStyle = x.strokeStyle;
      x.strokeRect(d.x0 * sx, d.y0 * sy, (d.x1 - d.x0) * sx, (d.y1 - d.y0) * sy);
      const label = d.id.split('-')[1] + s.sym + ' ' + Math.round(d.s * 100);
      x.fillRect(d.x0 * sx, d.y0 * sy - 26, x.measureText(label).width + 10, 26);
      x.fillStyle = '#111'; x.fillText(label, d.x0 * sx + 5, d.y0 * sy - 6);
    }
  }
  async function loop() {
    while (running) {
      const v = $('video');
      if (v.readyState >= 2 && v.videoWidth) {
        const t0 = performance.now();
        let dets = [];
        try { dets = decode((await session.run({ images: toTensor(v) })).output0, $('thr').value / 100); }
        catch (e) { $('debug').textContent = 'Erreur de détection : ' + e.message; await new Promise(r => setTimeout(r, 500)); continue; }
        drawBoxes(dets);
        const now = {}; dets.forEach(d => { now[d.id] = (seen[d.id] || 0) + 1; });
        seen = now;
        for (const id of Object.keys(now)) if (now[id] >= STABLE && !taken.includes(id)) { taken.push(id); render(); flash(id); }
        $('debug').textContent = (dets.length ? dets.map(d => `${d.id.replace('-', ' ')} ${Math.round(d.s * 100)}%`).join(' · ') : 'aucune carte détectée')
          + `\n${Math.round(performance.now() - t0)} ms`;
      }
      await new Promise(r => setTimeout(r, 10));
    }
  }
  function flash(id) {
    const f = $('flash'), s = suitOf(id);
    f.textContent = id.split('-')[1] + s.sym; f.style.color = s.red ? '#c62828' : '#222'; f.classList.add('on');
    const el = document.querySelector(`.card[data-id="${id}"]`); el.classList.add('hit');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(() => { f.classList.remove('on'); el.classList.remove('hit'); }, 500);
  }
  async function start() {
    $('start').disabled = true; $('start').textContent = 'Chargement…';
    try {
      await loadModel();
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
      const v = $('video'); v.srcObject = stream; await v.play();
      if (!v.videoWidth) await new Promise(r => v.addEventListener('loadedmetadata', r, { once: true }));
      layout(); $('off').hidden = true; seen = {};
      running = true; $('start').textContent = 'Arrêter'; loop();
    } catch (e) { $('off').hidden = false; $('off').textContent = 'Erreur : ' + (e.message || e); $('start').textContent = 'Démarrer la caméra'; }
    $('start').disabled = false;
  }
  function stop() {
    running = false; if (stream) stream.getTracks().forEach(t => t.stop());
    $('over').getContext('2d').clearRect(0, 0, 9999, 9999);
    $('off').hidden = false; $('off').textContent = 'Caméra arrêtée.'; $('start').textContent = 'Démarrer la caméra';
  }
  $('start').onclick = () => (running ? stop() : start());
  $('thr').oninput = () => { $('thrv').textContent = $('thr').value + ' %'; };

  const VERSION = 8;   // à incrémenter à chaque mise en ligne
  $('version').textContent = 'v' + VERSION;
  render();
</script>
</body>
</html>
