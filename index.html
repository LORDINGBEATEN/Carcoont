<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compteur Manille</title>
<style>
  :root { --bg: #0f5132; --panel: #fffdf6; --ink: #1c1c1c; --red: #c62828; --accent: #f2b705; --muted: #8a8a7a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif;
    min-height: 100vh; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); user-select: none; }
  main { max-width: 640px; margin: 0 auto; }
  .score { background: rgba(0,0,0,.25); border-radius: 16px; padding: 14px 18px; display: flex;
    align-items: center; justify-content: space-between; }
  .score .big { font-size: 56px; font-weight: 800; line-height: 1; }
  .score .big small { font-size: 20px; font-weight: 500; opacity: .7; }
  .score .side { text-align: right; font-size: 14px; opacity: .9; line-height: 1.5; }
  .score .side b { font-size: 18px; }
  .cam { position: relative; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4/3; width: 100%; }
  .cam video { width: 100%; height: 100%; object-fit: fill; display: block; }
  .cam .guide { position: absolute; border: 3px dashed rgba(255,255,255,.85); border-radius: 12px; pointer-events: none; }
  .cam .guide::after { content: ''; position: absolute; left: 2%; top: 2%; width: 22%; height: 30%;
    border: 2px solid var(--accent); border-radius: 6px; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    font-size: 15px; opacity: .9; background: rgba(0,0,0,.5); }
  .cam .badge { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.65); border-radius: 10px;
    padding: 6px 12px; font-size: 14px; }
  .cam .flash { position: absolute; right: 10px; top: 10px; background: var(--accent); color: #222; font-weight: 800;
    font-size: 30px; padding: 8px 14px; border-radius: 14px; opacity: 0; transition: opacity .4s; }
  .cam .flash.on { opacity: 1; transition: none; }
  .actions { display: flex; gap: 8px; margin: 12px 0; }
  button.act { flex: 1; padding: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #222; }
  button.act.alt { background: rgba(255,255,255,.18); color: #fff; }
  button.act:disabled { opacity: .4; }
  .hint { font-size: 13px; opacity: .8; margin: 6px 2px 10px; line-height: 1.4; }
  .learn { background: rgba(0,0,0,.25); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  .learn h3 { margin: 0 0 6px; font-size: 15px; }
  .lgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 8px 0; }
  .lc { position: relative; border: 0; border-radius: 8px; height: 48px; padding: 0; background: var(--panel); color: var(--ink);
    font-size: 17px; font-weight: 800; line-height: 1.05; }
  .lc.red { color: var(--red); }
  .lc small { display: block; font-size: 15px; font-weight: 400; }
  .lc.done { background: var(--accent); }
  .lc.done::after { content: attr(data-n); position: absolute; top: 1px; right: 4px; font-size: 10px; color: #4a3a00; }
  .lc:active { transform: scale(.92); }
  .learn .actions { margin: 6px 0 0; }
  /* mode apprentissage : caméra fixée en haut, grille juste dessous, le reste masqué */
  body.learning .score, body.learning .dbg, body.learning .main-actions, body.learning #deck, body.learning .ver { display: none; }
  body.learning { padding-top: 6px; }
  body.learning .cam { position: sticky; top: 6px; z-index: 10; margin-top: 0; }
  body.learning .learn { margin-bottom: 0; }
  .dbg { display: flex; gap: 10px; align-items: center; font-family: monospace; font-size: 12px; opacity: .85; margin: 4px 2px 10px; }
  .dbg canvas { background: #000; width: 66px; height: 118px; border-radius: 4px; flex: none; }
  .suit { margin-top: 14px; }
  .suit h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { background: var(--panel); color: var(--ink); border-radius: 10px; border: 0; padding: 10px 0 6px;
    font-size: 24px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .card.red { color: var(--red); }
  .card .pts { font-size: 11px; font-weight: 600; color: var(--muted); }
  .card.taken { background: var(--accent); }
  .card.taken .pts { color: #4a3a00; }
  .card.hit { outline: 3px solid #fff; }
</style>
</head>
<body>
<main>
  <div class="score">
    <div class="big"><span id="total">0</span><small> / 60</small></div>
    <div class="side">
      <div><b id="count">0</b> cartes</div>
      <div>Adversaires : <b id="opp">60</b></div>
    </div>
  </div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="guide" id="guide"></div>
    <div class="off" id="off">Touchez « Démarrer la caméra ».<br>Placez chaque carte dans le cadre en pointillés,<br>coin chiffré dans le petit carré jaune.</div>
    <div class="badge" id="badge" hidden></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="dbg"><canvas id="dbgc" width="99" height="177"></canvas><div id="debug">—</div></div>

  <div class="actions main-actions">
    <button class="act" id="start">Démarrer la caméra</button>
    <button class="act alt" id="learnBtn">Apprentissage</button>
  </div>
  <div class="actions main-actions">
    <button class="act alt" id="undo">↩︎ Annuler</button>
    <button class="act alt" id="reset">Nouvelle donne</button>
  </div>

  <div class="learn" id="learn" hidden>
    <div class="hint" id="learnMsg" style="margin:0"></div>
    <div class="lgrid" id="lgrid"></div>
    <div class="actions"><button class="act alt" id="clearTpl">Tout oublier</button>
      <button class="act" id="doneLearn">Terminé</button></div>
  </div>

  <div id="deck"></div>
  <p class="hint ver" style="text-align:center;margin-top:20px">Compteur Manille · <b id="version"></b></p>
</main>

<script>
  const SUITS = [
    { id: 'coeur', name: 'Cœurs', sym: '♥', red: true }, { id: 'carreau', name: 'Carreaux', sym: '♦', red: true },
    { id: 'pique', name: 'Piques', sym: '♠', red: false }, { id: 'trefle', name: 'Trèfles', sym: '♣', red: false },
  ];
  // Manille : 10 = 5, As = 4, Roi = 3, Dame = 2, Valet = 1, le reste 0 (total 60)
  const VALUES = [{ l: '10', p: 5 }, { l: 'A', p: 4 }, { l: 'R', p: 3 }, { l: 'D', p: 2 }, { l: 'V', p: 1 }, { l: '9', p: 0 }, { l: '8', p: 0 }, { l: '7', p: 0 }];
  const $ = id => document.getElementById(id);
  const ptsOf = id => VALUES.find(v => v.l === id.split('-')[1]).p;
  const suitOf = id => SUITS.find(s => s.id === id.split('-')[0]);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let taken = load('manille-v3', []);          // cartes comptées, dans l'ordre
  let tpl = load('manille-tpl-v1', { r: [], s: [] });   // exemples appris : {l: label, f: [...]}

  // ---------- Affichage des 32 cartes ----------
  SUITS.forEach(s => {
    const sec = document.createElement('section'); sec.className = 'suit';
    sec.innerHTML = `<h2><span>${s.sym} ${s.name}</span><span id="sub-${s.id}"></span></h2><div class="row"></div>`;
    VALUES.forEach(v => {
      const id = `${s.id}-${v.l}`, b = document.createElement('button');
      b.className = 'card' + (s.red ? ' red' : ''); b.dataset.id = id;
      b.innerHTML = `${v.l}<span>${s.sym}</span><span class="pts">${v.p} pt${v.p > 1 ? 's' : ''}</span>`;
      b.onclick = () => {
        const i = taken.indexOf(id); i >= 0 ? taken.splice(i, 1) : taken.push(id); render();
      };
      sec.querySelector('.row').appendChild(b);
    });
    $('deck').appendChild(sec);
  });
  function render() {
    let total = 0;
    document.querySelectorAll('.card').forEach(el => {
      const on = taken.includes(el.dataset.id); el.classList.toggle('taken', on);
      if (on) total += ptsOf(el.dataset.id);
    });
    SUITS.forEach(s => {
      const sub = taken.filter(id => id.startsWith(s.id + '-')).reduce((a, id) => a + ptsOf(id), 0);
      $('sub-' + s.id).textContent = sub ? sub + ' pts' : '';
    });
    $('total').textContent = total; $('count').textContent = taken.length; $('opp').textContent = 60 - total;
    $('undo').disabled = !taken.length; store('manille-v3', taken);
  }
  $('undo').onclick = () => { taken.pop(); render(); };
  $('reset').onclick = () => { if (!taken.length || confirm('Effacer la donne en cours ?')) { taken = []; render(); } };

  // ---------- Analyse d'une image de carte (300x420, carte alignée dans le cadre) ----------
  const CW = 450, CH = 630, CX0 = 9, CX1 = 108, CY0 = 12, CY1 = 189;   // zone du coin chiffré
  const GW = 16, GH = 24;                                             // taille des vignettes comparées

  function glyph(lum, ink, w, run, rgb) {
    // boîte englobante de l'encre dans la bande de lignes [y0,y1], puis vignette GWxGH
    let x0 = w, x1 = -1;
    for (let y = run[0]; y <= run[1]; y++) for (let x = 0; x < w; x++) if (ink[y * w + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
    if (x1 - x0 < 5) return null;
    const bw = x1 - x0 + 1, bh = run[1] - run[0] + 1, f = new Array(GW * GH).fill(0);
    let red = 0, n = 0;
    for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
      const ya = run[0] + Math.floor(gy * bh / GH), yb = Math.max(ya + 1, run[0] + Math.floor((gy + 1) * bh / GH));
      const xa = x0 + Math.floor(gx * bw / GW), xb = Math.max(xa + 1, x0 + Math.floor((gx + 1) * bw / GW));
      let c = 0, t = 0;
      for (let y = ya; y < yb; y++) for (let x = xa; x < xb; x++) { t++; if (ink[y * w + x]) c++; }
      f[gy * GW + gx] = +(c / t).toFixed(2);
    }
    // léger flou 3x3 : rend la comparaison moins sensible aux décalages d'un pixel
    const g = f.slice();
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy >= 0 && yy < GH && xx >= 0 && xx < GW) { const k = dx || dy ? 1 : 2; s += g[yy * GW + xx] * k; n += k; }
      }
      f[y * GW + x] = +(s / n).toFixed(2);
    }
    for (let y = run[0]; y <= run[1]; y++) for (let x = x0; x <= x1; x++) if (ink[y * w + x]) {
      const i = (y * w + x) * 4; red += rgb[i] - (rgb[i + 1] + rgb[i + 2]) / 2; n++;
    }
    return { f, red: n ? red / n : 0, box: [x0, run[0], bw, bh] };
  }

  function otsu(lum) {   // seuil encre/papier robuste aux éclairages inégaux
    const hist = new Array(256).fill(0); let sum = 0;
    for (const v of lum) { hist[Math.min(255, v | 0)]++; sum += v; }
    let wB = 0, sB = 0, max = 0, t = 0;
    for (let i = 0; i < 256; i++) {
      wB += hist[i]; if (!wB) continue;
      const wF = lum.length - wB; if (!wF) break;
      sB += i * hist[i];
      const between = wB * wF * (sB / wB - (sum - sB) / wF) ** 2;
      if (between > max) { max = between; t = i; }
    }
    return t;
  }

  // moyenne des 3 dernières lectures de même couleur : lisse le bruit de la caméra
  let buf = [];
  function smooth(a) {
    if (a.none) { buf = []; return a; }
    buf.push(a); if (buf.length > 3) buf.shift();
    const same = buf.filter(x => x.red === a.red), avg = k => a[k].map((_, i) => same.reduce((s, x) => s + x[k][i], 0) / same.length);
    return { ...a, rf: avg('rf'), sf: avg('sf') };
  }

  function analyze(cv) {
    const w = CX1 - CX0, h = CY1 - CY0;
    const rgb = cv.getContext('2d', { willReadFrequently: true }).getImageData(CX0, CY0, w, h).data;
    const lum = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) lum[i] = rgb[i * 4] * .3 + rgb[i * 4 + 1] * .59 + rgb[i * 4 + 2] * .11;
    const paper = Float32Array.from(lum).sort()[Math.floor(w * h * .8)];
    const ink = new Uint8Array(w * h), thr = Math.max(40, Math.min(otsu(lum), paper * .8));
    for (let i = 0; i < w * h; i++) ink[i] = lum[i] < thr ? 1 : 0;
    // bandes de lignes contenant de l'encre (écarts de 2 lignes tolérés)
    const runs = []; let cur = null, gap = 0;
    for (let y = 0; y < h; y++) {
      let c = 0; for (let x = 0; x < w; x++) c += ink[y * w + x];
      if (c >= 3) { if (!cur) cur = [y, y]; else cur[1] = y; gap = 0; }
      else if (cur && ++gap > 3) { if (cur[1] - cur[0] >= 12) runs.push(cur); cur = null; gap = 0; }
    }
    if (cur && cur[1] - cur[0] >= 12) runs.push(cur);
    const dbg = { ink, w, h, runs };
    if (paper < 90 || runs.length < 2) return { dbg, none: true };
    const r = glyph(lum, ink, w, runs[0], rgb), s = glyph(lum, ink, w, runs[1], rgb);
    if (!r || !s) return { dbg, none: true };
    return { dbg, rf: r.f, sf: s.f, red: s.red > 35 };
  }

  // distance tolérante à un décalage d'une case dans chaque direction
  const dist = (a, b) => {
    let best = 9;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      let d = 0;
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        const yy = y + dy, xx = x + dx;
        d += Math.abs(a[y * GW + x] - (yy >= 0 && yy < GH && xx >= 0 && xx < GW ? b[yy * GW + xx] : 0));
      }
      if (d / a.length < best) best = d / a.length;
    }
    return best;
  };
  function nearest(f, list) {
    const by = {};   // meilleure distance par étiquette
    for (const t of list) { const d = dist(f, t.f); if (by[t.l] === undefined || d < by[t.l]) by[t.l] = d; }
    const ds = Object.entries(by).sort((a, b) => a[1] - b[1]);
    if (!ds.length) return null;
    return { l: ds[0][0], d: ds[0][1], m: ds[1] ? ds[1][1] - ds[0][1] : 1 };   // m : écart avec le 2e choix
  }
  const isRed = l => l === 'coeur' || l === 'carreau';
  const MAXD = 0.22;
  function recognize(a) {
    if (!tpl.r.length || !tpl.s.length) return { msg: 'apprentissage requis' };
    const r = nearest(a.rf, tpl.r), s = nearest(a.sf, tpl.s.filter(t => isRed(t.l) === a.red));
    if (!r || !s) return { msg: 'couleur inconnue' };
    const msg = `rang ${r.l} (${r.d.toFixed(2)}) · ${s.l} (${s.d.toFixed(2)})`;
    const sure = r.d < MAXD && s.d < MAXD && r.m > .015 && s.m > .015;
    return sure ? { id: `${s.l}-${r.l}`, msg } : { msg: 'incertain : ' + msg };
  }

  // ---------- Caméra ----------
  const card = document.createElement('canvas'); card.width = CW; card.height = CH;
  let stream, running = false, last = null;
  let cand = null, candN = 0, empty = 2, armed = true;
  const STABLE = 3, GAP = 2;

  function cropFromVideo() {
    const v = $('video'), vw = v.videoWidth, vh = v.videoHeight;
    const gh = Math.min(vh * .9, vw * .95 * 7 / 5), gw = gh * 5 / 7, sx = (vw - gw) / 2, sy = (vh - gh) / 2;
    card.getContext('2d', { willReadFrequently: true }).drawImage(v, sx, sy, gw, gh, 0, 0, CW, CH);
    return { gw, gh, sx, sy, vw, vh };
  }
  function layoutGuide() {
    const v = $('video'), vw = v.videoWidth, vh = v.videoHeight, g = $('guide');
    const gh = Math.min(vh * .9, vw * .95 * 7 / 5), gw = gh * 5 / 7;
    $('cam').style.width = `min(100%, ${(document.body.classList.contains('learning') ? 34 : 55) * vw / vh}vh)`; $('cam').style.aspectRatio = vw + '/' + vh;
    Object.assign(g.style, { left: ((vw - gw) / 2 / vw * 100) + '%', top: ((vh - gh) / 2 / vh * 100) + '%',
      width: (gw / vw * 100) + '%', height: (gh / vh * 100) + '%' });
  }
  function drawDebug(d) {
    const c = $('dbgc'), x = c.getContext('2d'), im = x.createImageData(d.w, d.h);
    for (let i = 0; i < d.w * d.h; i++) { const v = d.ink[i] ? 255 : 30; im.data.set([v, v, v, 255], i * 4); }
    x.putImageData(im, 0, 0);
  }

  async function loop() {
    while (running) {
      const v = $('video');
      if (v.readyState >= 2 && v.videoWidth) {
        cropFromVideo();
        const raw = analyze(card); drawDebug(raw.dbg); const a = smooth(raw); last = a;
        let id = null, msg = 'pas de carte';
        if (!a.none) { const r = recognize(a); id = r.id || null; msg = r.msg; }
        $('debug').textContent = msg; $('badge').textContent = id ? id.replace('-', ' ') : msg.split(':')[0];
        step(id);
      }
      await new Promise(r => setTimeout(r, 90));
    }
  }
  function step(id) {
    if (!id) { cand = null; candN = 0; if (++empty >= GAP) armed = true; return; }
    empty = 0;
    if (id === cand) candN++; else { cand = id; candN = 1; armed = true; }
    if (candN >= STABLE && armed) {
      armed = false;
      if (!taken.includes(id)) { taken.push(id); render(); flash(id); }
    }
  }
  function flash(id) {
    const f = $('flash'), s = suitOf(id);
    f.textContent = id.split('-')[1] + s.sym; f.style.color = s.red ? '#c62828' : '#222'; f.classList.add('on');
    const el = document.querySelector(`.card[data-id="${id}"]`); el.classList.add('hit');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(() => { f.classList.remove('on'); el.classList.remove('hit'); }, 500);
  }
  async function start() {
    $('start').disabled = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
      const v = $('video'); v.srcObject = stream; await v.play();
      if (!v.videoWidth) await new Promise(r => v.addEventListener('loadedmetadata', r, { once: true }));
      layoutGuide(); $('off').hidden = true; $('badge').hidden = false;
      running = true; $('start').textContent = 'Arrêter'; loop();
    } catch (e) { $('off').hidden = false; $('off').textContent = 'Caméra indisponible : ' + (e.message || e); }
    $('start').disabled = false;
  }
  function stop() {
    running = false; if (stream) stream.getTracks().forEach(t => t.stop());
    $('badge').hidden = true; $('off').hidden = false; $('off').textContent = 'Caméra arrêtée.'; $('start').textContent = 'Démarrer la caméra';
  }
  $('start').onclick = () => (running ? stop() : start());

  // ---------- Apprentissage ----------
  // tpl.c : cartes déjà enregistrées (pour afficher les coches)
  if (!tpl.c) tpl.c = [];
  const learning = () => document.body.classList.contains('learning');
  function renderLearn() {
    $('lgrid').innerHTML = SUITS.map(su => VALUES.map(v => {
      const id = `${su.id}-${v.l}`, n = tpl.c.filter(x => x === id).length;
      return `<button class="lc${su.red ? ' red' : ''}${n ? ' done' : ''}" data-id="${id}" data-n="${n || ''}">${v.l}<small>${su.sym}</small></button>`;
    }).join('')).join('');
    const miss = [...VALUES.filter(v => !tpl.r.some(t => t.l === v.l)).map(v => v.l), ...SUITS.filter(s => !tpl.s.some(t => t.l === s.id)).map(s => s.sym)];
    if (!$('learnMsg').dataset.keep) $('learnMsg').textContent = miss.length
      ? 'Visez une carte dans le cadre, puis touchez-la ci-dessous. Il manque : ' + miss.join(' ')
      : 'Tout est appris ✓ Ajoutez des exemples si besoin, puis « Terminé ».';
  }
  function say(msg) {
    const m = $('learnMsg'); m.textContent = msg; m.dataset.keep = '1';
    clearTimeout(say.t); say.t = setTimeout(() => { delete m.dataset.keep; renderLearn(); }, 1800);
  }
  async function setLearning(on) {
    if (on && !running) await start();
    document.body.classList.toggle('learning', on); $('learn').hidden = !on;
    if (running) layoutGuide();
    if (on) { renderLearn(); window.scrollTo(0, 0); }
  }
  $('learnBtn').onclick = () => setLearning(!learning());
  $('doneLearn').onclick = () => setLearning(false);
  $('lgrid').onclick = e => { const b = e.target.closest('.lc'); if (b) { const [su, r] = b.dataset.id.split('-'); enroll(r, su); } };
  function enroll(rank, suit) {   // un seul geste : toucher la carte vue par la caméra
    if (!last || last.none) return say('Aucune carte lue : placez-la dans le cadre.');
    if (isRed(suit) !== last.red) return say('Cette couleur ne correspond pas au rouge/noir vu par la caméra.');
    tpl.r.push({ l: rank, f: last.rf }); tpl.s.push({ l: suit, f: last.sf }); tpl.c.push(`${suit}-${rank}`);
    store('manille-tpl-v1', tpl);
    if (navigator.vibrate) navigator.vibrate(30);
    renderLearn(); say('Enregistré : ' + rank + suitOf(suit + '-x').sym);
  }
  $('clearTpl').onclick = () => { if (confirm('Oublier tout l\'apprentissage ?')) { tpl = { r: [], s: [], c: [] }; store('manille-tpl-v1', tpl); renderLearn(); } };

  const VERSION = 5;  // à incrémenter à chaque mise en ligne
  $('version').textContent = 'v' + VERSION;
  render();
</script>
</body>
</html>
